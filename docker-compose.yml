# Among-I Server — Docker Compose
#
# No local repo needed — the Dockerfile clones the repo at build time.
# You only need:
#   1. This file + the Dockerfile in the same directory
#   2. firebase-key.json (from Firebase Console → Service Accounts)
#
# Usage:
#   docker compose up -d
#   docker compose logs -f
#
# Multiple servers: SERVER_NAME=node2 docker compose -p node2 up -d

services:
  server:
    build: .
    container_name: amongi-server
    restart: unless-stopped

    # ── Volumes ──────────────────────────────────────────────────────
    volumes:
      # Service account key (required, read-only)
      - ./firebase-key.json:/app/engine/firebase-key.json:ro
      # Log output (persisted between restarts)
      - amongi-logs:/app/log

    # ── Ports ────────────────────────────────────────────────────────
    # Render relay port (for remote Godot). Comment out if using --funnel.
    ports:
      - "8081:8081"

    # ── Environment ──────────────────────────────────────────────────
    environment:
      - SERVER_NAME=${SERVER_NAME:-}
      - FIREBASE_CRED_PATH=firebase-key.json
      - STUDY_ID=${STUDY_ID:-}
      - HEARTBEAT_INTERVAL=${HEARTBEAT_INTERVAL:-30}

    # ── Command ─────────────────────────────────────────────────────
    command: >
      --name ${SERVER_NAME:-}
      --log-dir /app/log
      --heartbeat-interval ${HEARTBEAT_INTERVAL:-30}
      --render
      ${FUNNEL:+--funnel}

volumes:
  amongi-logs:
