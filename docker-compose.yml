# Among-I Server — Docker Compose
#
# Usage:
#   1. Place firebase-key.json in engine/ (from Firebase Console → Service Accounts)
#   2. docker compose up -d
#   3. Check logs: docker compose logs -f
#
# Multiple servers on one host: docker compose -p server2 up -d
#   (the --name flag defaults to hostname; override: SERVER_NAME=my-node)

version: "3.8"

services:
  server:
    build: .
    image: amongi-server:latest
    container_name: amongi-server
    restart: unless-stopped

    # ── Volumes ──────────────────────────────────────────────────────
    volumes:
      # Service account key (required, read-only)
      - ./engine/firebase-key.json:/app/engine/firebase-key.json:ro
      # Log output (persisted between restarts)
      - amongi-logs:/app/log

    # ── Ports ────────────────────────────────────────────────────────
    # Render relay port (for remote Godot). Comment out if using --funnel.
    ports:
      - "8081:8081"

    # ── Environment ──────────────────────────────────────────────────
    environment:
      - SERVER_NAME=${SERVER_NAME:-}              # defaults to container hostname
      - FIREBASE_CRED_PATH=firebase-key.json
      - FIRESTORE_COLLECTION=${FIRESTORE_COLLECTION:-studies}
      - STUDY_ID=${STUDY_ID:-}                     # optional: only accept jobs for this study
      - HEARTBEAT_INTERVAL=${HEARTBEAT_INTERVAL:-30}

    # ── Command ─────────────────────────────────────────────────────
    # --render starts the render relay for remote Godot connections
    # --funnel enables Tailscale funnel (requires Tailscale auth in container)
    command: >
      --name ${SERVER_NAME:-}
      --log-dir /app/log
      --heartbeat-interval ${HEARTBEAT_INTERVAL:-30}
      --render
      ${FUNNEL:+--funnel}

volumes:
  amongi-logs:
